<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pelajar DITN4 | Politeknik Ungku Omar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">PORTAL DITN4</div>
        <div class="nav-links">
            <a href="index.html" class="active">Carian Profil</a>
            <a href="student_login.html">Log Masuk Pelajar</a>
            <a href="lecturer_login.html">Log Masuk Pensyarah</a>
            <a href="admin_login.html">Log Masuk Admin</a>
        </div>
    </nav>

    <header>
        <h1>PORTAL PELAJAR DITN4</h1>
        <p>Politeknik Ungku Omar</p>
    </header>

    <div class="container" style="justify-content: center; display: flex;">
        <!-- Kad Carian Profil Utama -->
        <div class="card" style="max-width: 500px; width: 100%;">
            <h2>Carian Profil Pelajar</h2>
            <form id="searchForm">
                <div class="form-group">
                    <label for="noMatrik">Nombor Matrik:</label>
                    <input type="text" id="noMatrik" placeholder="Contoh: 01DIT24F2042" required>
                </div>
                <button type="submit" class="btn">Cari Profil</button>
            </form>

            <div id="searchResult" class="result-box"></div>
            <div id="searchError" class="error-msg"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 DITN4 Politeknik Ungku Omar. Hak Cipta Terpelihara.</p>
    </footer>

    <script>
        const DEFAULT_AVATAR = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const noMatrik = document.getElementById('noMatrik').value;
            const resultBox = document.getElementById('searchResult');
            const errorBox = document.getElementById('searchError');
            
            resultBox.classList.remove('active');
            errorBox.innerText = '';

            try {
                const res = await fetch(`/api/search?no_matrik=${noMatrik}`);
                const data = await res.json();

                if (res.ok) {
                    const imgUrl = data.gambar_url || DEFAULT_AVATAR;
                    resultBox.innerHTML = `
                        <img src="${imgUrl}" alt="Profil" class="profile-avatar">
                        <div class="profile-detail">
                            <p><strong>Nama:</strong> ${data.nama}</p>
                            <p><strong>No Matrik:</strong> ${data.no_matrik}</p>
                            <p><strong>Jantina:</strong> ${data.jantina || '-'}</p>
                            <p><strong>Kursus:</strong> ${data.kursus}</p>
                            <p><strong>Institusi:</strong> ${data.institusi}</p>
                        </div>
                    `;
                    resultBox.classList.add('active');
                } else {
                    errorBox.innerText = data.message || 'Pelajar tidak dijumpai';
                }
            } catch (err) {
                errorBox.innerText = 'Ralat berhubung dengan server';
            }
        });
    </script>
</body>
</html>
